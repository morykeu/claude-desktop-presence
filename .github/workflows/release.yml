name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # The daemon is Windows-only and pkg needs a Windows host to produce the .exe.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned: a floating major has changed npm's behaviour under us before.
          node-version: '22.14.0'
          cache: npm

      # npm ci must be allowed to run install scripts. esbuild's postinstall is what
      # downloads its platform binary; without it tsup fails at build time with a
      # missing-binary error that looks nothing like the actual cause. koffi needs the
      # same for its prebuilt .node.
      - name: Install dependencies
        run: npm ci --foreground-scripts

      - name: Verify install scripts actually ran
        shell: bash
        run: |
          test -f node_modules/@esbuild/win32-x64/esbuild.exe \
            || { echo "esbuild binary missing - install scripts did not run"; exit 1; }
          test -f node_modules/@koromix/koffi-win32-x64/win32_x64/koffi.node \
            || { echo "koffi native module missing - install scripts did not run"; exit 1; }

      - run: npm run lint
      - run: npm run typecheck

      # The measurement-derived sections of README.md, README.cs.md, SPEC.md and
      # SPEC.cs.md are generated from src/measurement.ts. A release must not ship
      # documentation that no longer matches the numbers the daemon actually uses.
      - run: npm run docs:check

      - run: npm test

      - name: Package the .exe
        run: npm run package

      - name: Verify the windowless build really is windowless
        shell: pwsh
        run: |
          # PE subsystem: 3 = CONSOLE, 2 = WINDOWS. If the patch silently stopped
          # working, autostart would pop a cmd window at every logon and nothing else
          # would notice.
          function Get-Subsystem($path) {
            $fs = [System.IO.File]::OpenRead($path)
            try {
              $br = New-Object System.IO.BinaryReader($fs)
              $fs.Position = 0x3C
              $pe = $br.ReadUInt32()
              $fs.Position = $pe + 4 + 20 + 68
              return $br.ReadUInt16()
            } finally { $fs.Dispose() }
          }
          $console = Get-Subsystem 'release/claude-desktop-presence.exe'
          $bg      = Get-Subsystem 'release/claude-desktop-presence-bg.exe'
          Write-Host "console build subsystem: $console (expect 3)"
          Write-Host "bg build subsystem     : $bg (expect 2)"
          if ($console -ne 3) { Write-Error 'the console build is not a console app'; exit 1 }
          if ($bg -ne 2) { Write-Error 'the -bg build was not patched to WINDOWS'; exit 1 }

      - name: Smoke-test the packaged binary — first run
        shell: bash
        run: |
          mkdir -p smoke
          cp release/claude-desktop-presence.exe smoke/
          cp config.example.json smoke/
          cd smoke
          # No config yet: it must create one next to the .exe and say what is missing.
          ./claude-desktop-presence.exe > out.txt 2>&1 || true
          cat out.txt
          test -f config.json || { echo "the .exe did not create config.json next to itself"; exit 1; }
          grep -q "clientId" out.txt || { echo "missing the prompt to fill in clientId"; exit 1; }

      # This one has to run WITHOUT --no-discord. The console transport short-circuits
      # createDiscordTransport entirely, so a dry run never loads @xhayper/discord-rpc —
      # which is exactly how a packaged build that could not connect at all got through
      # a green pipeline once already.
      - name: Smoke-test the packaged binary — Discord transport actually loads
        shell: pwsh
        run: |
          Set-Location smoke
          $config = Get-Content config.json -Raw | ConvertFrom-Json
          $config.clientId = '1234567890123456789'   # syntactically valid, not a real app
          $config | ConvertTo-Json -Depth 10 | Set-Content config.json -Encoding utf8

          $proc = Start-Process -FilePath .\claude-desktop-presence.exe `
            -ArgumentList '--debug' -PassThru -NoNewWindow `
            -RedirectStandardOutput run-out.txt -RedirectStandardError run-err.txt
          Start-Sleep -Seconds 15
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }

          $output = (Get-Content run-out.txt, run-err.txt -Raw -ErrorAction SilentlyContinue) -join "`n"
          $logPath = Join-Path $env:LOCALAPPDATA 'claude-desktop-presence\daemon.log'
          if (Test-Path $logPath) { $output += "`n" + (Get-Content $logPath -Raw) }
          Write-Host $output

          # pkg cannot execute a dynamic import; if one is left anywhere in the module
          # graph this is where it surfaces.
          if ($output -match 'dynamic import') {
            Write-Error 'The packaged .exe hit a dynamic import - pkg cannot execute those.'
            exit 1
          }
          # Positive assertion too: a silent no-op must not pass as success. Discord is
          # not running on the runner, so a connection failure here is the healthy result
          # — what matters is that the transport was reached at all.
          if ($output -notmatch '\[discord\]') {
            Write-Error 'The daemon never reached the Discord transport; the smoke test proved nothing.'
            exit 1
          }
          Write-Host 'OK: the Discord transport loaded and ran inside the packaged .exe.'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claude-desktop-presence-win-x64
          path: |
            release/claude-desktop-presence.exe
            release/claude-desktop-presence-bg.exe
            config.example.json
            scripts/install-autostart.ps1

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/claude-desktop-presence.exe
            release/claude-desktop-presence-bg.exe
            config.example.json
            scripts/install-autostart.ps1
          body: |
            Windows x64 build.

            Two binaries, same program: the console one for anything interactive, and
            `-bg` for autostart, which starts without a console window.

            1. Put both .exe files and `config.example.json` in the same folder.
            2. Run `claude-desktop-presence.exe` once — it creates `config.json` and asks for your Discord Application ID.
            3. Run `claude-desktop-presence.exe --calibrate` and paste the result into the config.
            4. Optional: `install-autostart.ps1` registers `-bg` to start at logon.

            The .exe is unsigned, so SmartScreen or Defender may flag it. See the README
            for how to run it from source instead if you would rather not click through that.
